- id: marjan-r1
  group: vehicle
  title: Marjan-R1 ROV
  page: platforms/marjan-r1.html
  featured_on_home: true
  status: "Integrated prototype. Validated in controlled pool experiments."
  card: "Marjan-R1 supports our work in dynamic modelling, system identification, control, sensing and underwater inspection."
  spec:
    Purpose: "Inspection and station keeping in controlled water; research platform for control and system identification."
    Current status: "Integrated prototype validated in controlled pool experiments. No open-water operation yet."
    Propulsion: "Eight vectored thrusters, six degrees of freedom"
    Dimensions: "567 × 324 × 352 mm"
    Mass: "15.2 kg, neutrally buoyant"
    Design depth rating: "80-100 m"
    Power and link: "Tethered power and communication; video and telemetry to a ground station"
    Speed: "Up to 2 knots"
    Demonstrated: "Watertight operation, hydrostatic trim, thruster control, open-loop step responses, video and telemetry over tether (pool); real-time hydrodynamic parameter estimation via UKF."
    Test environment: "Laboratory pool"
    Open research questions: "Closed-loop 6-DoF control; integration of a sensing payload; behavior in seawater"
    Related publications: "Development and Dynamic Modelling of Marjan-R1 (ASCC 2026); Real-Time Hydrodynamic Parameter Estimation of an Over actuated 3-DOF ROV Using Unscented Kalman Filter"
    Lead researchers: "Dr. Sarvat Ahmad, Dr. Ali AlBeladi, Syed Imtiaz Ali Shah, Masroor Khan"
    Last updated: "September 2026"

- id: glider
  group: vehicle
  title: Underwater glider
  page: platforms/glider.html
  status: "Modeled and simulated. Hardware in development."
  card: "Buoyancy-driven vehicle for energy-efficient, long-duration observation."
  spec:
    Purpose: "Energy-efficient, long-endurance observation of confined underwater regions"
    Current status: "Modeled and simulated. Hardware in development. No wet testing yet."
    Actuation: "Buoyancy engine and moving-mass mechanism"
