name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - uses: quarto-dev/quarto-actions/setup@v2

      # `_generated/` is git-ignored (it's derived from _data/) and is normally produced by the
      # `project: pre-render:` hook in _quarto.yml. But on a fresh checkout, Quarto resolves
      # {{< include >}} directives while building its project file list, BEFORE that hook runs,
      # so `quarto render` fails immediately if _generated/ doesn't already exist. Build it
      # explicitly first so the directory is there before rendering starts.
      - name: Build data
        run: python scripts/build_data.py

      - name: Render site
        run: quarto render

      - name: Quality checks (links, images, alt text, placeholders)
        run: python scripts/check_site.py

      # Publish only from main. Pull requests build and check but do not deploy.
      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
